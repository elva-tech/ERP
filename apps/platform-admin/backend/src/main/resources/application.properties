spring.application.name=platform-admin-backend
server.port=8080

# Neon PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://ep-dry-surf-azu0j16f-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&connectTimeout=30&socketTimeout=30
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hikari Connection Pool (Fix for Neon Serverless)
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000